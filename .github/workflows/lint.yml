name: Shell lint

# Runs shellcheck over every tracked shell file on pull requests that touch
# one. Kept separate from pr-ci.yml so a launcher-only edit does not drag in a
# CmdStan compile. The shellcheck version is pinned to an exact release tarball
# rather than the runner's apt package, which floats with the Ubuntu image, so
# a new shellcheck release cannot turn this check red on its own.
on:
  pull_request:
    branches: [main]
    paths:
      - "**.sh"
      - "**.command"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

# A new push to a pull request cancels that pull request's run still in
# progress. This workflow triggers on pull_request alone, so the number is
# always set.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: shellcheck tracked shell files
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned shellcheck
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          # --fail matters: without it curl exits 0 on a 404 and writes the
          # error page to the tarball, so a renamed release asset reports as a
          # checksum mismatch, which reads like a wrong pin or tampering.
          curl -sSL --fail -o shellcheck.tar.xz "$url"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          sudo install -m 0755 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # One `git ls-files` call writes the list, and everything below reads
      # that list. Enumerating twice would let the count and the lint disagree.
      #
      # The list is asserted non-empty, because a pathspec that stops matching
      # makes shellcheck lint nothing and exit 0, which reads exactly like a
      # clean run.
      #
      # -x follows `# shellcheck source=` directives, which the launchers need
      # because they source launcher_common.sh. -S info fails on error, warning
      # and info findings, and SC2086, the unquoted-expansion check, is
      # info-level.
      - name: shellcheck
        run: |
          set -euo pipefail
          list="${RUNNER_TEMP}/shell-files.z"
          git ls-files -z '*.sh' '*.command' > "$list"
          n=$(tr -dc '\0' < "$list" | wc -c)
          if [ "$n" -eq 0 ]; then
            echo "::error::no shell files enumerated, so shellcheck would have linted nothing"
            exit 1
          fi
          echo "linting $n files"
          xargs -0 shellcheck -x -S info < "$list"
