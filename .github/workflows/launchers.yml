name: Launchers

# Runs the CRLF-in-blob guard on pull requests that can change what a Windows
# launcher ships as, and the stop-message guard on pull requests that can change
# a stop launcher. Kept separate from pr-ci.yml, whose paths filter starts an
# image build, because a launcher-only change does not need one. pr-ci.yml runs
# both guards too, with the other suites in .github/tests/.
on:
  pull_request:
    branches: [main]
    paths:
      - "**.bat"
      - ".gitattributes"
      - "stop_linux.sh"
      - "stop_mac.command"
      - ".github/tests/test_launcher_line_endings.sh"
      - ".github/tests/test_stop_launcher_text.sh"
      - ".github/workflows/launchers.yml"

permissions:
  contents: read

# A new push to a pull request cancels that pull request's run still in
# progress. This workflow triggers on pull_request alone, so the number is
# always set.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  line-endings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Launcher CRLF-in-blob guard
        run: bash ./.github/tests/test_launcher_line_endings.sh

      - name: Stop launcher message guard
        run: bash ./.github/tests/test_stop_launcher_text.sh
