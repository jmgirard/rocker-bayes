name: Build and push Docker images

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "scripts/**"
      - ".github/workflows/docker.yml"
      - ".github/smoke-test.sh"
      - ".github/smoke-fixtures/**"
      - ".github/publish-guard.sh"
  # Weekly rebuild to pick up base-image (jmgirard/rstudio2u) updates
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Exercise the whole lane without publishing: every leg builds, pushes its layers by digest, is pulled back and smoke-tested, then the publish job assembles both manifest lists, checks them, prints the tag list it would apply, and attaches nothing."
        type: boolean
        default: false
      keepalive_threshold:
        description: "How many days of quiet on the default branch make the keepalive job push an empty commit. Set 0 to commit on this run whatever the branch's age. .github/keepalive.sh refuses a value that is not a whole number of at most seven digits once leading zeros are dropped, which fails the keepalive job. The scheduled run has no inputs and uses the fallback of 50 in the keepalive job."
        type: string
        default: "50"
      notify:
        description: "Run the notify job on this dispatch, as a scheduled run does. It opens, comments on, or closes the ci-failure issue from this run's results. A fully green dispatch closes an open issue."
        type: boolean
        default: false

env:
  IMAGE: jmgirard/rocker-bayes
  # The total number of attempts a run may have. retry-on-failure and notify
  # both hand it to .github/retry-decision.sh, so they agree on when a rerun
  # will follow.
  RETRY_CAP: "3"

jobs:
  # One leg per (variant, architecture), each on a runner of that architecture,
  # so nothing is emulated and the CmdStan compile runs at native speed. Each
  # leg pushes its layers WITHOUT a tag, pulls that exact digest back, proves it
  # is the architecture the leg claims, and smoke-tests it. The bytes that get
  # tested are the bytes that ship. An untagged push is invisible to users: no
  # moving tag moves until the publish job assembles the manifest lists, which
  # it only completes when all four legs passed.
  build:
    name: build (${{ matrix.variant }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # A failure on one leg must not cancel the others mid-build: the legs that
      # do pass must still upload their digests, so the publish job can count
      # them and report the shortfall rather than being skipped in silence.
      fail-fast: false
      matrix:
        include:
          - variant: noble
            base_tag: noble
            arch: amd64
            runner: ubuntu-latest
          - variant: noble
            base_tag: noble
            arch: arm64
            runner: ubuntu-24.04-arm
          - variant: resolute
            base_tag: resolute
            arch: amd64
            runner: ubuntu-latest
          - variant: resolute
            base_tag: resolute
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Every ref pushes by digest now, not just the default branch: the
      # pull-back, the architecture assertions, and the smoke test all read the
      # pushed image, so a branch run that skipped the push could not exercise
      # the gate it exists to prove.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: jmgirard
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve CmdStan version
        id: meta
        run: |
          set -euo pipefail
          CMDSTAN=$(grep -oP '(?<=^ARG CMDSTAN_VERSION=")[^"]+' Dockerfile)
          # Without this check a reformatted ARG line yields an empty CMDSTAN,
          # the step still exits 0 on the echo, and every leg builds with an
          # empty --build-arg override before the publish job catches it.
          if [ -z "$CMDSTAN" ]; then
            echo "::error::could not read CMDSTAN_VERSION from the Dockerfile ARG line"
            exit 1
          fi
          echo "cmdstan=$CMDSTAN" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.variant }} (${{ matrix.arch }}) and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BASE_TAG=${{ matrix.base_tag }}
            CMDSTAN_VERSION=${{ steps.meta.outputs.cmdstan }}
          provenance: false
          # Always re-pull the rstudio2u base so builds pick up newer R/RStudio
          pull: true
          # Scheduled/manual runs rebuild from scratch so they actually pull in
          # the updated base and recompile CmdStan; push (code change) builds
          # use the cache.
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # Pull the pushed digest back and prove it is the architecture this leg
      # claims, both as the image records it and as the running kernel reports
      # it. Without these two assertions a mis-wired matrix could smoke-test the
      # same amd64 image twice and still look green.
      - name: Pull back the pushed image and assert its architecture
        id: pulled
        run: |
          set -euo pipefail
          ref="${IMAGE}@${{ steps.build.outputs.digest }}"
          docker pull "$ref"
          got_arch=$(docker image inspect --format '{{.Architecture}}' "$ref")
          if [ "$got_arch" != "${{ matrix.arch }}" ]; then
            echo "::error::image architecture is '$got_arch', expected '${{ matrix.arch }}'"
            exit 1
          fi
          case "${{ matrix.arch }}" in
            amd64) want_uname=x86_64 ;;
            arm64) want_uname=aarch64 ;;
            *) echo "::error::unknown arch '${{ matrix.arch }}'"; exit 1 ;;
          esac
          got_uname=$(docker run --rm --entrypoint uname "$ref" -m)
          if [ "$got_uname" != "$want_uname" ]; then
            echo "::error::container reports 'uname -m' = '$got_uname', expected '$want_uname'"
            exit 1
          fi
          echo "image is ${{ matrix.arch }} ($got_arch / $got_uname): $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # A non-zero exit here fails this leg, and because the publish job
      # requires all four digests, blocks every tag from moving. The CmdStan
      # phase is the reason this repo needs its own smoke test: the base image
      # has no CmdStan, so nothing upstream exercises it.
      - name: Smoke-test ${{ matrix.variant }} (${{ matrix.arch }})
        env:
          SMOKE_TIMEOUT: "300"
        run: bash ./.github/smoke-test.sh "${{ steps.pulled.outputs.ref }}"

      # Hand the verified digest to the publish job. This runs only after the
      # smoke test passed, so an unverified leg contributes no digest and the
      # publish job's count comes up short.
      - name: Export the verified digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # One publish job for all four legs, not one per variant. Both variants are
  # supported surfaces, so a broken resolute leg holds the noble tags back too:
  # both manifest lists are assembled and checked before either variant's tags
  # are attached (GP4).
  #
  # !cancelled() is required so a run with a failed leg still reaches the digest
  # guard, which is what reports the shortfall. always() would do that too, but
  # it also stays true when the run itself is cancelled, so four green legs
  # followed by a cancel would still attach every tag. 'skipped' and 'cancelled'
  # are excluded: nothing was built, so there is nothing to assemble.
  publish:
    name: publish
    needs: build
    if: >-
      !cancelled()
      && needs.build.result != 'cancelled'
      && needs.build.result != 'skipped'
      && (github.ref == 'refs/heads/main' || inputs.test_mode)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: jmgirard
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Three downloads of the same artifacts: one flat copy for the
      # all-four-legs count, and one per variant for assembling that variant's
      # manifest list. A pattern that matches nothing creates no directory,
      # which publish-guard.sh reports as a count of zero.
      - name: Download every verified digest
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests/all
          pattern: digests-*
          merge-multiple: true

      - name: Download the noble digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests/noble
          pattern: digests-noble-*
          merge-multiple: true

      - name: Download the resolute digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests/resolute
          pattern: digests-resolute-*
          merge-multiple: true

      # First gate: all four legs smoke-tested clean. A short count means a leg
      # failed or was skipped, and no tag may move for either variant.
      - name: Require all four verified digests
        run: bash ./.github/publish-guard.sh digests /tmp/digests/all 4

      # Second gate: assemble both manifest lists with --dry-run, which
      # produces the exact index a real create would push, and require each to
      # name both linux architectures. Counting four digest files proves only
      # that four legs uploaded something, never that each assembled index
      # covers two architectures. Nothing is tagged in this step.
      - name: Assemble and check both manifest lists
        id: assemble
        env:
          NOBLE_MUTABLE: "latest noble"
          RESOLUTE_MUTABLE: "resolute"
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          CMDSTAN=$(grep -oP '(?<=^ARG CMDSTAN_VERSION=")[^"]+' Dockerfile)
          if [ -z "$DATE" ] || [ -z "$CMDSTAN" ]; then
            echo "::error::could not resolve the build date and CmdStan version (date='$DATE', cmdstan='$CMDSTAN')"
            exit 1
          fi

          for variant in noble resolute; do
            case "$variant" in
              noble)    mutable="$NOBLE_MUTABLE" ;;
              resolute) mutable="$RESOLUTE_MUTABLE" ;;
            esac

            tags=()
            for t in $mutable; do tags+=("$IMAGE:$t"); done
            tags+=("$IMAGE:${variant}-${DATE}" "$IMAGE:${variant}-cmdstan${CMDSTAN}")

            refs=()
            while IFS= read -r f; do
              refs+=("${IMAGE}@sha256:$(basename "$f")")
            done < <(find "/tmp/digests/${variant}" -type f | sort)

            tag_args=()
            for t in "${tags[@]}"; do tag_args+=(-t "$t"); done

            echo "tags for ${variant}:"
            printf '  %s\n' "${tags[@]}"
            docker buildx imagetools create --dry-run "${tag_args[@]}" "${refs[@]}" \
              | tee "/tmp/manifest-${variant}.json"
            bash ./.github/publish-guard.sh manifest "/tmp/manifest-${variant}.json" "$variant"

            printf '%s\n' "${tag_args[@]}" > "/tmp/tagargs-${variant}.txt"
            printf '%s\n' "${refs[@]}" > "/tmp/refs-${variant}.txt"
          done

      # Both indexes passed, so attach the tags. In test mode nothing is
      # attached: the run has already exercised every leg, both assemblies, and
      # both guards, and the tag list it would have applied is printed above.
      - name: Attach the tags
        env:
          TEST_MODE: ${{ inputs.test_mode }}
        run: |
          set -euo pipefail
          if [ "$TEST_MODE" = "true" ]; then
            echo "test mode: both manifest lists were assembled and checked, and no tag was attached"
            exit 0
          fi
          for variant in noble resolute; do
            tag_args=()
            while IFS= read -r a; do [ -n "$a" ] && tag_args+=("$a"); done < "/tmp/tagargs-${variant}.txt"
            refs=()
            while IFS= read -r r; do [ -n "$r" ] && refs+=("$r"); done < "/tmp/refs-${variant}.txt"
            docker buildx imagetools create "${tag_args[@]}" "${refs[@]}"
            docker buildx imagetools inspect "$IMAGE:$variant"
          done

  # Keep the `schedule` trigger above from being switched off. GitHub disables
  # a public repository's scheduled workflows after 60 days without repository
  # activity, and a disabled schedule runs no rebuild and no watchdog. This job
  # pushes an empty commit when the default branch has been quiet for 50 days.
  # The commit changes no file, so it matches no `paths` filter and starts no
  # build. The rule lives in .github/keepalive.sh, tested offline by
  # .github/tests/test_keepalive.sh. Push runs skip the job, because they are
  # already the activity it exists to make.
  keepalive:
    name: keepalive
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # No write scope. The push authenticates with the deploy key below, never
    # with this token, and the repository's default workflow token stays
    # read-only.
    permissions:
      contents: read
    steps:
      # Two checkouts, because the script and the commit can come from different
      # refs. The script is read from the ref this workflow file came from, so a
      # dispatch aimed at a branch runs that branch's version of it. The commit
      # lands on the default branch whatever ref was dispatched. On a scheduled
      # run the two are the same ref.
      #
      # The accepted exposure: on a dispatch against a branch, that branch's
      # copy of keepalive.sh runs while the deploy key is in scope. Dispatching
      # already requires write access to this repository, so it reaches nothing
      # a dispatcher could not reach anyway.
      - name: Check out this workflow's own ref for the script
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out the default branch for the commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: default-branch
          # A write-enabled deploy key on this repository only. checkout stores
          # it and points the remote at SSH, which is what the `git push` inside
          # keepalive.sh uses.
          ssh-key: ${{ secrets.KEEPALIVE_DEPLOY_KEY }}

      - name: Commit if the default branch has gone quiet
        working-directory: default-branch
        env:
          # Empty on a scheduled run, where there are no inputs, so the 50 here
          # is the scheduled policy. The dispatch input's default states the
          # same 50.
          THRESHOLD: ${{ inputs.keepalive_threshold || '50' }}
        run: |
          set -euo pipefail
          # Both dates in UTC: format-local with TZ=UTC renders the committer
          # date in UTC, and `date -u` gives today in the same zone.
          commit_date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%d)
          today=$(date -u +%Y-%m-%d)
          echo "default branch tip is dated $commit_date; today is $today (UTC)"
          bash "$GITHUB_WORKSPACE/.github/keepalive.sh" "$commit_date" "$today" "$THRESHOLD"

  # Report a scheduled run's outcome through the ci-failure issue: a failure
  # opens it or comments on it, and a fully green run closes it. A dispatch runs
  # this job too when its `notify` input is set.
  #
  # `needs` and RESULTS name every other job except retry-on-failure, which
  # needs this job instead. GitHub refuses to rerun a workflow while any of its
  # jobs is still pending, so retry-on-failure has to start after this job has
  # finished. A job added to `needs` and not to RESULTS, or the reverse, is a
  # job whose failure goes unreported.
  #
  # always() runs the job whatever the results are, including when a leg
  # failed and publish was skipped.
  notify:
    name: notify
    needs: [build, publish, keepalive]
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.notify))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # When a rerun will follow and no job it cannot heal failed, this attempt
      # reports nothing, and the rerun's own notify decides what the issue says.
      # The rule is in .github/retry-decision.sh, which retry-on-failure reads
      # too. The open, comment, or close rule is in .github/ci-failure-issue.sh.
      - name: Open, update, or close the ci-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULTS: build=${{ needs.build.result }} publish=${{ needs.publish.result }} keepalive=${{ needs.keepalive.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Deliberately unquoted: RESULTS is a space-separated list.
          # shellcheck disable=SC2086
          if ! decision=$(bash ./.github/retry-decision.sh "$GITHUB_RUN_ATTEMPT" "$RETRY_CAP" $RESULTS); then
            # A refused decision must not silence the alert, so report.
            echo "::warning::retry-decision.sh refused its inputs; reporting this attempt"
            decision="wait=false"
          fi
          if printf '%s\n' "$decision" | grep -qx 'wait=true'; then
            echo "attempt $GITHUB_RUN_ATTEMPT of $RETRY_CAP failed in build or publish and a rerun follows; not reporting yet"
            exit 0
          fi
          # A failed job listing must not block the alert: warn, and let the
          # script fall back to its generic text. An empty file, not
          # '{"jobs":[]}', because the script reads an empty listing as "no
          # listing available" rather than as a contradiction.
          gh run view "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --json jobs > jobs.json || {
            echo "::warning::gh run view failed; the issue will not name the failed jobs"
            : > jobs.json
          }
          # ci-failure-issue.sh takes the bare results, so strip each `job=`.
          # shellcheck disable=SC2086
          bare=$(printf '%s\n' $RESULTS | sed 's/^[a-z-]*=//' | xargs)
          bash ./.github/ci-failure-issue.sh "$bare" "$RUN_URL" jobs.json

  # If any build leg failed, it is almost always an amd64 runner that could not
  # reach the single r2u mirror on its egress IP (arm64 native runners are
  # reliable). Re-running the whole workflow puts each leg on a fresh runner with
  # a new IP; unchanged legs restore from the build cache, so only the failed one
  # actually rebuilds and re-contacts the mirror. RETRY_CAP bounds the attempts.
  #
  # It needs publish as well as build, and notify after both. GitHub refuses to
  # rerun a workflow that has a job pending or in flight ("This workflow is
  # already running"), so this job starts only after every other job finished.
  #
  # !cancelled() lets the job start when a need failed or was skipped.
  # .github/retry-decision.sh then reruns only when build or publish failed and
  # the attempt is below RETRY_CAP. A keepalive or notify failure alone never
  # reruns the four legs.
  retry-on-failure:
    needs: [build, publish, notify]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Re-run on fresh runners
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: build=${{ needs.build.result }} publish=${{ needs.publish.result }}
        run: |
          set -euo pipefail
          # Deliberately unquoted: RESULTS is a space-separated list.
          # shellcheck disable=SC2086
          decision=$(bash ./.github/retry-decision.sh "$GITHUB_RUN_ATTEMPT" "$RETRY_CAP" $RESULTS)
          echo "$decision"
          if ! printf '%s\n' "$decision" | grep -qx 'retry=true'; then
            echo "no rerun: build and publish did not fail, or attempt $GITHUB_RUN_ATTEMPT reached the cap of $RETRY_CAP"
            exit 0
          fi
          sleep 30
          gh run rerun "${{ github.run_id }}" --repo "${{ github.repository }}"
