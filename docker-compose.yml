services:
  bayes:
    image: jmgirard/rocker-bayes:latest
    build:
      context: .
      args:
        BASE_TAG: "noble"
    ports:
      - "127.0.0.1:${RS_PORT:-8787}:8787"
    environment:
      - PASSWORD=${RS_PASS:-rstudio}
      - ROOT=true
      - DISABLE_AUTH=true
    volumes:
      # Persist the user's home directory (files, settings, and installed R
      # packages) so work survives `docker compose down`, image updates, and
      # pruning. The named volume is pre-populated from the image on first run.
      # CmdStan lives in the image at /opt/cmdstan, outside this volume.
      - rstudio_home:/home/rstudio

volumes:
  rstudio_home:
